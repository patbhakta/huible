id: five-friends-v0
namespace: pat.personas
description: |
  HU-2811 Five-Friends test v0 EXECUTION (HU-2309 §1.7.4/§1.8 H4): five
  vault-grounded personas through the real engine chat path, description-only
  comparator arm, cross-vault leakage gate, seeded blind pairing, 5-dim
  scoring package. Boss-gated (--i-am-the-boss mirrors the kit doctrine).

  VEHICLE CHANGE (2026-09-10 23:3xZ, HU-2811): trigger DISABLED — the Kestra
  Process taskRunner executes INSIDE the kestra2 container, where
  /root/repos/huible does not exist (no repo mount) and the harness's host
  bindings (127.0.0.1:8000 engine, docker exec psql) are unreachable. Zero
  executions ever succeeded under this pattern (r9 flow included: total=0).
  Execution now runs as a HOST-side detached one-shot at 2026-09-11 00:40Z
  (after the z.ai daily token reset; effective ceiling 2M/day via
  ZAI_DAILY_TOKEN_LIMIT; planned draw ~155k). Evidence: runs/hu2811/ +
  docs/evidence/hu2811_five_friends_v0/. Collection monitor on HU-2811
  (nextCheckAt 2026-09-11T02:00Z). Tasks kept as the canonical command line.

tasks:
  - id: preflight
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - "python3 /root/repos/huible/scripts/v2_harness/h4_five_friends_run.py --check"
  - id: execute
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - "python3 /root/repos/huible/scripts/v2_harness/h4_five_friends_run.py --i-am-the-boss --run --turns 35 --out-dir /root/repos/huible/runs/hu2811"

errors:
  - id: fail-log
    type: io.kestra.plugin.core.log.Log
    message: "HU-2811 Five-Friends v0: preflight or execution FAILED (leakage gate fail / fake-voice guard / budget exhaustion all exit non-zero)"

triggers:
  - id: one-shot-2026-09-11
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "40 0 11 9 *"
    timezone: UTC
    disabled: true
