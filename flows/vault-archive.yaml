id: huible-vault-archive
namespace: huible

description: |
  ## HUible Client Vault Archival
  
  Safely deprovisions and archives a client vault:
  - Exports CouchDB database to JSON backup
  - Archives (or purges) the GitHub repo
  - Deletes CouchDB database + scoped user
  - Archives local vault to tar.gz
  - Updates registry to "archived" status

labels:
  component: vault
  action: archive

inputs:
  - id: client_slug
    type: STRING
    description: "Client slug from provisioning"
    required: true
  - id: purge
    type: BOOLEAN
    description: "Permanently delete GitHub repo instead of archiving"
    required: true
    defaults: false
  - id: keep_data
    type: BOOLEAN
    description: "Backup only - do not delete CouchDB or local files"
    required: true
    defaults: false

triggers:
  - id: webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "huible-vault-archive-webhook"

variables:
  script: "/root/repos/huible/scripts/vault_archive.py"
  v_slug: "{{ trigger.body.client_slug is defined ? trigger.body.client_slug : inputs.client_slug }}"
  v_purge: "{{ trigger.body.purge is defined ? trigger.body.purge : inputs.purge }}"
  v_keep: "{{ trigger.body.keep_data is defined ? trigger.body.keep_data : inputs.keep_data }}"

tasks:
  - id: validate-inputs
    type: io.kestra.plugin.core.log.Log
    message: |
      Archiving vault:
        Client slug: {{ vars.v_slug }}
        Purge: {{ vars.v_purge }}
        Keep data: {{ vars.v_keep }}

  - id: archive-vault
    type: io.kestra.core.tasks.scripts.Bash
    description: "Run vault_archive.py"
    env:
      COUCH_ADMIN_USER: obsidian
      COUCH_ADMIN_PASS: "{{ envs.COUCH_ADMIN_PASS }}"
      GITHUB_TOKEN: "{{ envs.GITHUB_TOKEN | default('') }}"
      GITHUB_ORG: patbhakta
    commands:
      - |
        ARGS="--client-slug {{ vars.v_slug }}"
        {{ vars.v_purge }} && ARGS="$ARGS --purge"
        {{ vars.v_keep }} && ARGS="$ARGS --keep-data"
        python3 {{ vars.script }} $ARGS
    retry:
      type: constant
      interval: PT10S
      maxAttempt: 2

  - id: report-success
    type: io.kestra.plugin.core.log.Log
    message: |
      Vault archived: {{ vars.v_slug }}
      Check: /root/repos/client-vaults/archived/

outputs:
  - id: result
    type: STRING
    value: "{{ outputs['archive-vault'].vars | default('check-logs') }}"

errors:
  - id: on-error
    type: io.kestra.plugin.core.log.Log
    message: |
      Vault archival FAILED for {{ vars.v_slug }}
      Check registry: cat /root/repos/client-vaults/registry.json
