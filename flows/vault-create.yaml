id: huible-vault-create
namespace: huible

description: |
  ## HUible Client Vault Creation
  
  Provisions a complete client vault:
  - CouchDB database + scoped user for Obsidian LiveSync
  - Vault directory from HUible template (OKF persona profile)
  - Private GitHub repo for version control
  - Registration in client tracking registry
  
  **Triggers:** Manual, Webhook (from onboarding flow), or Subflow call

labels:
  component: vault
  action: create

inputs:
  - id: client_name
    type: STRING
    description: "Display name of the client (e.g. 'Sarah Johnson')"
    required: true
  - id: persona_name
    type: STRING
    description: "Name of the deceased persona to memorialize (e.g. 'James Johnson')"
    required: true
  - id: relationship
    type: STRING
    description: "Client's relationship to persona (e.g. 'wife', 'son', 'friend')"
    required: true

triggers:
  - id: webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "huible-vault-create-{{ secret('WEBHOOK_KEY') | default('prod') }}"

variables:
  script: "/root/repos/huible/scripts/vault_create.py"

tasks:
  - id: validate-inputs
    type: io.kestra.plugin.core.log.Log
    message: |
      Provisioning vault:
        Client: {{ inputs.client_name }}
        Persona: {{ inputs.persona_name }}
        Relationship: {{ inputs.relationship }}

  - id: provision-vault
    type: io.kestra.core.tasks.scripts.Bash
    description: "Run vault_create.py — CouchDB + template + git + registry"
    env:
      COUCH_ADMIN_USER: obsidian
      COUCH_ADMIN_PASS: ***REMOVED***
      GITHUB_TOKEN: "{{ envs.GITHUB_TOKEN | default('') }}"
      GITHUB_ORG: patbhakta
    commands:
      - python3 {{ vars.script }} --client-name "{{ inputs.client_name }}" --persona-name "{{ inputs.persona_name }}" --relationship "{{ inputs.relationship }}"
    retry:
      type: constant
      interval: PT10S
      maxAttempt: 3

  - id: report-success
    type: io.kestra.plugin.core.log.Log
    message: |
      ✅ Vault created successfully
      
      Client: {{ inputs.client_name }}
      Persona: {{ inputs.persona_name }}
      
      LiveSync URL: https://brain.bhakta.us
      Check registry: /root/repos/client-vaults/registry.json

outputs:
  - id: result
    type: STRING
    value: "{{ outputs['provision-vault'].vars | default('check-logs') }}"

errors:
  - id: on-error
    type: io.kestra.plugin.core.log.Log
    message: |
      ❌ Vault creation FAILED for {{ inputs.client_name }}
      
      Check:
        - CouchDB running: systemctl status couchdb
        - GitHub token set: echo $GITHUB_TOKEN | head -c 4
        - Registry dir exists: ls /root/repos/client-vaults/
