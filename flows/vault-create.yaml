id: huible-vault-create
namespace: huible

description: |
  ## HUible Client Vault Creation
  
  Provisions a complete client vault:
  - CouchDB database + scoped user for Obsidian LiveSync
  - Vault directory from HUible template (OKF persona profile)
  - Private GitHub repo for version control
  - Registration in client tracking registry
  
  **Triggers:** Manual, Webhook (from onboarding flow), or Subflow call

labels:
  component: vault
  action: create

inputs:
  - id: client_name
    type: STRING
    description: "Display name of the client"
    required: true
  - id: persona_name
    type: STRING
    description: "Name of the deceased persona to memorialize"
    required: true
  - id: relationship
    type: STRING
    description: "Client relationship to persona (wife, son, friend, etc)"
    required: true

triggers:
  - id: webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "huible-vault-create-webhook"

variables:
  script: "/root/repos/huible/scripts/vault_create.py"
  v_client: "{{ trigger.body.client_name is defined ? trigger.body.client_name : inputs.client_name }}"
  v_persona: "{{ trigger.body.persona_name is defined ? trigger.body.persona_name : inputs.persona_name }}"
  v_relation: "{{ trigger.body.relationship is defined ? trigger.body.relationship : inputs.relationship }}"

tasks:
  - id: validate-inputs
    type: io.kestra.plugin.core.log.Log
    message: |
      Provisioning vault:
        Client: {{ vars.v_client }}
        Persona: {{ vars.v_persona }}
        Relationship: {{ vars.v_relation }}

  - id: provision-vault
    type: io.kestra.core.tasks.scripts.Bash
    description: "Run vault_create.py"
    env:
      COUCH_ADMIN_USER: obsidian
      COUCH_ADMIN_PASS: ***REMOVED***
      GITHUB_TOKEN: "{{ envs.GITHUB_TOKEN | default('') }}"
      GITHUB_ORG: patbhakta
    commands:
      - python3 {{ vars.script }} --client-name "{{ vars.v_client }}" --persona-name "{{ vars.v_persona }}" --relationship "{{ vars.v_relation }}"
    retry:
      type: constant
      interval: PT10S
      maxAttempt: 3

  - id: report-success
    type: io.kestra.plugin.core.log.Log
    message: |
      Vault created for {{ vars.v_client }} (persona: {{ vars.v_persona }})
      LiveSync: https://brain.bhakta.us
      Registry: /root/repos/client-vaults/registry.json

outputs:
  - id: result
    type: STRING
    value: "{{ outputs['provision-vault'].vars | default('check-logs') }}"

errors:
  - id: on-error
    type: io.kestra.plugin.core.log.Log
    message: |
      Vault creation FAILED for {{ vars.v_client }}
      Check CouchDB / GitHub token / registry dir
