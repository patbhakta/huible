id: huible-vault-media
namespace: huible
description: |
  [REPLACES the paused Aug-27 flow (Pat verdict: ungrounded text-to-image =
  'AI slop'). Reference-grounded pipeline per HU-2150/HU-2157:
  docs/IDENTITY_IMAGE_PIPELINE.md]

  Identity-grounded persona media — collect -> curate -> condition ->
  validate -> register. Identity comes from the curated, consented reference
  set; the prompt only describes the scene/pose change. Every asset is
  identity-gated (ArcFace cosine vs the curated set) before registration.

  HARD GATES (fail closed):
    - intake requires a consent attestation (rights basis=client_upload)
    - generation requires references/gate-config.json with
      production_safe=true (human gold-set calibration, calibrate_gate.py
      WITHOUT --force). confirm_rd_synthetic=true overrides for R&D
      synthetic-seed pipeline tests ONLY.
    - text-to-image for persona assets stays refused (generate_image.py
      enforces: --ref-image + flux-schnell = error)

  Voice lane removed — voice belongs to the HU-2151 pipeline (generate_voice.py
  CLI remains available meanwhile).

  Inputs:
    persona_root   e.g. /root/repos/personas/chandler-bing
    consent_by     consent attestation, e.g. client:chandler-bing:onboarding
    upload_dir     optional dir of consented reference photos (intake lane)
    image_prompt   the CHANGE only ("same person, hiking at sunrise")
    ref_photo_id   optional specific curated reference (default: best quality)
    retry          extra generation attempts after a gate reject (default 1)

  Provenance: scripts in /root/repos/huible/scripts (git). FAL_KEY comes from
  the Kestra worker environment.
inputs:
- id: persona_root
  type: STRING
  required: true
- id: consent_by
  type: STRING
  required: true
  description: Consent attestation for uploads (rights basis=client_upload); fail closed when missing
- id: upload_dir
  type: STRING
  required: false
  description: Optional directory of consented reference photos — runs collect+curate intake first
- id: image_prompt
  type: STRING
  required: true
  description: Scene/pose CHANGE only — identity comes from the reference, never the prompt
- id: ref_photo_id
  type: STRING
  required: false
  description: Optional curated photo_id to condition on (default best-quality reference)
- id: retry
  type: INT
  defaults: 1
  required: true
- id: confirm_rd_synthetic
  type: BOOLEAN
  defaults: false
  required: true
  description: R&D ONLY — allow generation with a non-production_safe (synthetic-calibrated) gate for synthetic-seed pipeline tests
variables:
  repo: /root/repos/huible
  venv_python: /usr/bin/python3
tasks:
- id: guard
  type: io.kestra.plugin.scripts.shell.Commands
  taskRunner:
    type: io.kestra.plugin.core.runner.Process
  description: Fail closed unless the gate is promoted (production_safe) or an explicit R&D synthetic ack is set
  commands:
  - >-
    test -d "{{ inputs.persona_root }}" || { echo "BLOCKED: persona_root not found"; exit 1; };
    if [ "{{ inputs.confirm_rd_synthetic }}" != "true" ]; then
    cfg="{{ inputs.persona_root }}/references/gate-config.json";
    test -f "$cfg" || { echo "BLOCKED: no gate config — run calibrate_gate.py (measure, never guess)"; exit 1; };
    grep -q '"production_safe": true' "$cfg" || { echo "BLOCKED: gate not production_safe — promote via human gold set (calibrate_gate.py WITHOUT --force) before client generation"; exit 1; };
    fi;
    echo "guard OK"
- id: intake
  type: io.kestra.plugin.scripts.python.Commands
  pythonVersion: '3.11'
  taskRunner:
    type: io.kestra.plugin.core.runner.Process
  description: Consented-upload intake — collect + curate + client-readable report (HU-2157 item 1)
  commands:
  - >-
    {{ vars.venv_python }} {{ vars.repo }}/scripts/onboarding_ref_intake.py
    --persona-root "{{ inputs.persona_root }}"
    --upload-dir "{{ inputs.upload_dir }}"
    --consent-by "{{ inputs.consent_by }}"
  runIf: "{{ inputs.upload_dir != null and inputs.upload_dir != '' }}"
- id: generate
  type: io.kestra.plugin.scripts.shell.Commands
  taskRunner:
    type: io.kestra.plugin.core.runner.Process
  description: Condition (Kontext) -> validate (identity gate) -> register (append-only provenance)
  commands:
  - >-
    args="--persona-root \"{{ inputs.persona_root }}\" --prompt \"{{ inputs.image_prompt }}\" --retry {{ inputs.retry }}";
    if [ -n "{{ inputs.ref_photo_id }}" ]; then args="$args --ref-photo-id \"{{ inputs.ref_photo_id }}\""; fi;
    if [ "{{ inputs.confirm_rd_synthetic }}" = "true" ]; then args="$args --allow-unsafe-gate"; fi;
    {{ vars.venv_python }} {{ vars.repo }}/scripts/ref_generate_validated.py $args
- id: manifest
  type: io.kestra.plugin.scripts.shell.Commands
  taskRunner:
    type: io.kestra.plugin.core.runner.Process
  description: Refresh the vault media manifest (file inventory only; provenance lives in identity-registry.jsonl)
  commands:
  - >-
    python3 -c
    "import json,glob,os,sys;
    root=sys.argv[1];
    files=[{'file':p.replace(root+'/',''),'bytes':os.path.getsize(p)} for p in glob.glob(root+'/media/**/*.*',recursive=True) if os.path.isfile(p)];
    os.makedirs(root+'/media',exist_ok=True);
    open(root+'/media/media-manifest.json','w').write(json.dumps({'generated_by':'kestra:huible/huible-vault-media','files':files},indent=2));
    print(json.dumps({'media_files':len(files)}))"
    "{{ inputs.persona_root }}"
