id: huible-onboard
namespace: huible
description: Persona onboarding — extract → clean → stats → distill → structure → validate
inputs:
- id: persona_name
  type: STRING
  description: Name of the persona to onboard
  required: true
- id: input_dir
  type: STRING
  description: Directory containing raw files (e.g. /root/repos/personas/<p>/01-garbage/raw-data)
  required: true
- id: audio_features
  type: STRING
  description: Optional path to MELD audio features CSV (or dir) for multimodal onboarding
  required: false
- id: use_llm
  type: BOOLEAN
  description: Enable LLM stages (structure always; distill LLM hook). false = deterministic smoke path, zero API spend
  required: true
  defaults: false
variables:
  work_dir: /root/repos/huible
  vault_dir: /root/repos/personas
  venv_python: /root/repos/huible/.venv/bin/python
tasks:
- id: extract
  type: io.kestra.plugin.scripts.python.Commands
  pythonVersion: '3.11'
  taskRunner:
    type: io.kestra.plugin.core.runner.Process
  description: Extract dialog data from raw files
  commands:
  - "python3 /root/repos/huible/modules/onboarding/extract.py --input-dir \"{{ inputs.input_dir }}\" --persona \"{{ inputs.persona_name }}\" --output \"/tmp/onboarding/{{ inputs.persona_name }}/extracted.jsonl\""
  retry:
    type: constant
    interval: PT10S
    maxAttempt: 3
- id: clean
  type: io.kestra.plugin.scripts.python.Commands
  pythonVersion: '3.11'
  taskRunner:
    type: io.kestra.plugin.core.runner.Process
  description: Clean and normalize dialog data
  commands:
  - "python3 /root/repos/huible/modules/onboarding/clean.py --input \"/tmp/onboarding/{{ inputs.persona_name }}/extracted.jsonl\" --output \"/tmp/onboarding/{{ inputs.persona_name }}/cleaned.jsonl\""
  retry:
    type: constant
    interval: PT10S
    maxAttempt: 3
- id: stats
  type: io.kestra.plugin.scripts.python.Commands
  pythonVersion: '3.11'
  taskRunner:
    type: io.kestra.plugin.core.runner.Process
  description: Deterministic statistics extraction (grounding anchor)
  commands:
  - "python3 /root/repos/huible/modules/onboarding/stats.py --input \"/tmp/onboarding/{{ inputs.persona_name }}/cleaned.jsonl\" --output \"/tmp/onboarding/{{ inputs.persona_name }}/stats.json\""
- id: audio
  type: io.kestra.plugin.scripts.python.Commands
  pythonVersion: '3.11'
  taskRunner:
    type: io.kestra.plugin.core.runner.Process
  description: Ingest per-utterance acoustic features (multimodal grounding)
  commands:
  - "if [ -z \"{{ inputs.audio_features | default('') }}\" ] || [ ! -e \"{{ inputs.audio_features | default('') }}\" ]; then echo \"audio: no features supplied, skipping multimodal stage\"; else python3 /root/repos/huible/modules/onboarding/audio.py --features \"{{ inputs.audio_features | default('') }}\" --persona \"{{ inputs.persona_name }}\" --cleaned \"/tmp/onboarding/{{ inputs.persona_name }}/cleaned.jsonl\" --output \"/tmp/onboarding/{{ inputs.persona_name }}/audio_features.json\" --augment-output \"/tmp/onboarding/{{ inputs.persona_name }}/cleaned_with_audio.jsonl\"; fi"
  retry:
    type: constant
    interval: PT10S
    maxAttempt: 3
- id: distill
  type: io.kestra.plugin.scripts.python.Commands
  pythonVersion: '3.11'
  taskRunner:
    type: io.kestra.plugin.core.runner.Process
  description: TencentDB L0-L3 distillation with citations (grounding)
  commands:
  - "INPUT=\"/tmp/onboarding/{{ inputs.persona_name }}/cleaned.jsonl\"; [ -f \"/tmp/onboarding/{{ inputs.persona_name }}/cleaned_with_audio.jsonl\" ] && INPUT=\"/tmp/onboarding/{{ inputs.persona_name }}/cleaned_with_audio.jsonl\"; CMD=\"--input $INPUT --stats /tmp/onboarding/{{ inputs.persona_name }}/stats.json --persona {{ inputs.persona_name }} --out-dir /tmp/onboarding/{{ inputs.persona_name }}/memory --strict\"; [ \"{{ inputs.use_llm }}\" = \"true\" ] && CMD=\"$CMD --llm\"; cd /root/repos/huible && PYTHONPATH=/root/repos/huible/src {{ vars.venv_python }} -m huible.distillation.cli $CMD"
  retry:
    type: constant
    interval: PT10S
    maxAttempt: 3
- id: structure
  type: io.kestra.plugin.scripts.python.Commands
  pythonVersion: '3.11'
  taskRunner:
    type: io.kestra.plugin.core.runner.Process
  description: Structure into persona markdown (flat OKF frontmatter) from grounded distillation memory
  commands:
  - "ARGS=\"--memory-dir /tmp/onboarding/{{ inputs.persona_name }}/memory --input /tmp/onboarding/{{ inputs.persona_name }}/cleaned.jsonl --audio /tmp/onboarding/{{ inputs.persona_name }}/audio_features.json --output-dir {{ vars.vault_dir }}/{{ inputs.persona_name }} --persona-name {{ inputs.persona_name }}\"; [ \"{{ inputs.use_llm }}\" != \"true\" ] && ARGS=\"$ARGS --no-llm\"; {{ vars.venv_python }} /root/repos/huible/modules/onboarding/structure.py $ARGS"
  retry:
    type: constant
    interval: PT30S
    maxAttempt: 3
- id: validate
  type: io.kestra.plugin.scripts.python.Commands
  pythonVersion: '3.11'
  taskRunner:
    type: io.kestra.plugin.core.runner.Process
  description: Validate persona doc frontmatter + body conformance
  commands:
  - "python3 /root/repos/huible/modules/onboarding/validate.py --dir \"{{ vars.vault_dir }}/{{ inputs.persona_name }}\" --output \"/tmp/onboarding/{{ inputs.persona_name }}/report.json\""
- id: report-gaps
  type: io.kestra.plugin.scripts.python.Commands
  pythonVersion: '3.11'
  taskRunner:
    type: io.kestra.plugin.core.runner.Process
  description: Emit gap list from distillation memory for the gap loop
  commands:
  - "python3 /root/repos/huible/modules/onboarding/gaps.py --memory-dir \"/tmp/onboarding/{{ inputs.persona_name }}/memory\" --persona \"{{ inputs.persona_name }}\" --output \"/tmp/onboarding/{{ inputs.persona_name }}/gaps.json\""
- id: summary
  type: io.kestra.plugin.core.log.Log
  message: "Onboarding complete for {{ inputs.persona_name }}\n\nMemory: /tmp/onboarding/{{ inputs.persona_name }}/memory (L0-L3 distillation)\nValidate: See /tmp/onboarding/{{ inputs.persona_name }}/report.json\nGaps: See /tmp/onboarding/{{ inputs.persona_name }}/gaps.json\n\nPersona docs: {{ vars.vault_dir }}/{{ inputs.persona_name }}/\n"
errors:
- id: on-error
  type: io.kestra.plugin.core.log.Log
  message: "Onboarding FAILED for {{ inputs.persona_name }}"
