services:
  fast-note-sync:
    image: haierkeys/fast-note-sync-service:latest
    container_name: fast-note-sync
    restart: unless-stopped
    ports:
      # Tailnet + loopback only — no public bind. Matches the manually
      # launched container created 2026-08-14T23:09Z so compose can adopt it.
      - "127.0.0.1:9000:9000"
      - "100.101.235.117:9000:9000"
    volumes:
      - /data/fast-note-sync/storage/:/fast-note-sync/storage/
      - /data/fast-note-sync/config/:/fast-note-sync/config/
