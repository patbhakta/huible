services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: huible-app
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - huible-net

  postgres:
    image: pgvector/pgvector:pg17
    container_name: huible-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-huible}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huible_dev}
      POSTGRES_DB: ${POSTGRES_DB:-huible}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-huible}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - huible-net

  caddy:
    image: caddy:2-alpine
    container_name: huible-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
    networks:
      - huible-net

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  huible-net:
    driver: bridge
