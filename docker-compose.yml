services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: huible-app
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    # Bind to loopback only: Caddy fronts public ingress over the huible-net
    # docker network (reverse_proxy app:8000), so the app must never be
    # reachable on a public interface (would bypass TLS). Localhost admin
    # (`curl http://localhost:8000/...`) still works. (docs/09 §8 hardening.)
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - huible-net

  postgres:
    image: pgvector/pgvector:pg17
    container_name: huible-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-huible}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huible_dev}
      POSTGRES_DB: ${POSTGRES_DB:-huible}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    # Never expose Postgres on a public interface (docs/09 §8 hardening).
    # The app reaches it over the huible-net docker network (POSTGRES_HOST=postgres),
    # so bind the host port to loopback for local admin/backups only.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-huible}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - huible-net

  caddy:
    image: caddy:2-alpine
    container_name: huible-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
    networks:
      - huible-net

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  huible-net:
    driver: bridge
