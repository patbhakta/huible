services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: huible-app
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    # Bind to loopback only: Caddy fronts public ingress over the huible-net
    # docker network (reverse_proxy app:8000), so the app must never be
    # reachable on a public interface (would bypass TLS). Localhost admin
    # (`curl http://localhost:8000/...`) still works. (docs/09 §8 hardening.)
    ports:
      - "127.0.0.1:8000:8000"
    # Durable app runtime state (OpenRouter monthly spend ledger for the
    # board-approved $50/mo hard cap, HU-1461): bind-mounted so container
    # recreation cannot reset month-to-date accrual.
    volumes:
      - ./docker/runtime/app-state:/var/lib/huible
    networks:
      - huible-net

  postgres:
    image: pgvector/pgvector:pg17
    container_name: huible-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-huible}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huible_dev}
      POSTGRES_DB: ${POSTGRES_DB:-huible}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    # Never expose Postgres on a public interface (docs/09 §8 hardening).
    # The app reaches it over the huible-net docker network (POSTGRES_HOST=postgres),
    # so bind the host port to loopback for local admin/backups only.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-huible}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - huible-net

  caddy:
    image: caddy:2-alpine
    container_name: huible-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
    networks:
      - huible-net

  # Monitoring profile (HU-1742, docs/09 §8 disk item): Prometheus +
  # node_exporter for the HuibleDiskFreeLow (< 20% free) host-disk alert and
  # the app §7.3 metrics. Loopback binds ONLY — no new public listeners (ufw
  # default-deny; verified by scripts/verify_prod_hardening.sh Monitoring
  # block). Enable with: docker compose --profile monitoring up -d
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.9.1
    container_name: huible-node-exporter
    restart: unless-stopped
    profiles:
      - monitoring
    command:
      - --path.rootfs=/host/root
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    # Host filesystem visibility: node_exporter must read the REAL host mounts
    # (pgdata named volume + /backups live on the host root fs), not the
    # container's own overlay view.
    pid: host
    volumes:
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - huible-net

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: huible-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./examples/prometheus-alerts.yml:/etc/prometheus/huible-alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - huible-net

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  prometheus_data:

networks:
  huible-net:
    driver: bridge
